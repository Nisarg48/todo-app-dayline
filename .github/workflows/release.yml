name: Build Dayline releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm --prefix frontend install --no-audit --no-fund
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v4
        with: { name: dayline-web, path: frontend/dist }

  desktop:
    needs: build-frontend
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            artifact: dayline-linux
          - os: windows-latest
            target: --win
            artifact: dayline-windows
          - os: macos-latest
            target: --mac
            artifact: dayline-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm --prefix frontend install --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: npm --prefix backend install --no-audit --no-fund
      - run: npm --prefix desktop install --no-audit --no-fund
      - run: node desktop/scripts/stage.js
      - run: npm --prefix desktop run dist -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip

  publish:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
