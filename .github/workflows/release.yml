name: Build GlassTodo releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm --prefix frontend install --no-audit --no-fund
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }

  desktop:
    needs: build-frontend
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm --prefix frontend install --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: npm --prefix backend install --no-audit --no-fund
      - run: npm --prefix desktop install --no-audit --no-fund
      - run: npm --prefix desktop run dist
      - uses: actions/upload-artifact@v4
        with:
          name: glasstodo-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip
